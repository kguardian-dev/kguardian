apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/name: cmangos-database
    app.kubernetes.io/part-of: kguardian
  name: cmangos-database-cilium-policy
  namespace: game-servers
spec:
  description: Cilium network policy for pod cmangos-database generated by kguardian
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:app: db
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  # host-network peer monitoring/node-exporter on node worker-1 — endpointSelector cannot match host traffic
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app: cmangos-database
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app: cmangos-backup
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP
status: {}
