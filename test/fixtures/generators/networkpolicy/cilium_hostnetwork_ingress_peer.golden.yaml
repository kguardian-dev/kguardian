apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: kguardian
  name: web-cilium-policy
  namespace: prod
spec:
  description: Cilium network policy for pod web generated by kguardian
  endpointSelector:
    matchLabels:
      k8s:app: web
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app: frontend
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # host-network peer ingress-nginx/ingress-nginx-controller on node worker-1 — endpointSelector cannot match host traffic
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
status: {}
