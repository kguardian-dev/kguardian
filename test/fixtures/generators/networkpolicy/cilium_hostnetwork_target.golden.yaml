# WARNING: monitoring/node-exporter runs with hostNetwork: true. A CiliumNetworkPolicy endpointSelector cannot select
# host-network pods; this policy will have no effect. Use a CiliumClusterwideNetworkPolicy
# with a nodeSelector (host firewall) instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/name: node-exporter-abc12
    app.kubernetes.io/part-of: kguardian
  name: node-exporter-abc12-cilium-policy
  namespace: monitoring
spec:
  description: Cilium network policy for pod node-exporter-abc12 generated by kguardian
  endpointSelector:
    matchLabels:
      k8s:app: node-exporter
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app: prometheus
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
status: {}
