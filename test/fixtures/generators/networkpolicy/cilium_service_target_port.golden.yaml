apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: kguardian
  name: web-cilium-policy
  namespace: prod
spec:
  description: Cilium network policy for pod web generated by kguardian
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:app: api
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
    - ports:
      - port: metrics
        protocol: TCP
  # service prod/svc/cache: port 6380/TCP could not be mapped to a targetPort; allowing the Service port as observed
  - toEndpoints:
    - matchLabels:
        k8s:app: cache
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
    - ports:
      - port: "6380"
        protocol: TCP
  # service prod/svc/legacy: port 8443/TCP could not be mapped to a targetPort; allowing the Service port as observed
  - toEndpoints:
    - matchLabels:
        k8s:app: legacy
    toPorts:
    - ports:
      - port: "8443"
        protocol: TCP
  # host-network peer monitoring/svc/exporter on node worker-1 — endpointSelector cannot match host traffic
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "5353"
        protocol: UDP
    - ports:
      - port: "5354"
        protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app: web
status: {}
