apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/name: cmangos-database
    app.kubernetes.io/part-of: kguardian
  name: cmangos-database-cilium-policy
  namespace: game-servers
spec:
  description: Cilium network policy for pod cmangos-database generated by kguardian
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:app: cmangos-web
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app: cmangos-database
  ingress:
  # unattributed peer 10.244.12.199 at 2026-07-23T10:00:00
  - fromCIDR:
    - 10.244.12.199/32
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP
status: {}
