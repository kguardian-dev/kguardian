apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: standard-policy
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kguardian
  name: prometheus-standard-policy
  namespace: monitoring
spec:
  egress:
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.96.0.10/32
  # host-network peer monitoring/node-exporter on node worker-1 — podSelector cannot match host traffic
  - ports:
    - port: 9100
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.168.50.101/32
  # host-network peer monitoring/node-exporter on node worker-2 — podSelector cannot match host traffic
  - ports:
    - port: 9100
      protocol: TCP
    to:
    - ipBlock:
        cidr: 192.168.50.102/32
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
  - Egress
