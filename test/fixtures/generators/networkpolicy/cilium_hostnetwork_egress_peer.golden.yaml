apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: cilium-policy
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kguardian
  name: prometheus-cilium-policy
  namespace: monitoring
spec:
  description: Cilium network policy for pod prometheus generated by kguardian
  egress:
  - toCIDR:
    - 10.96.0.10/32
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  # host-network peer monitoring/node-exporter on node worker-1 — endpointSelector cannot match host traffic
  # host-network peer monitoring/node-exporter on node worker-2 — endpointSelector cannot match host traffic
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "9100"
        protocol: TCP
  endpointSelector:
    matchLabels:
      k8s:app: prometheus
status: {}
