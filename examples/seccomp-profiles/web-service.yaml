# Example SeccompProfile, enforcing: the nginx profile from
# web-service-audit.yaml after promotion.
#
# This is a SAMPLE. Real profiles have to be generated by kguardian from your
# workload's observed syscalls, not copied from here. See README.md.
#
# The only change from the export is defaultAction: SCMP_ACT_LOG became
# SCMP_ACT_ERRNO, so a syscall outside the list now fails with EPERM. The
# inline comments are hand edits; the CR is yours to annotate and narrow in
# git.
#
# With seccomp.distribute=true, every kguardian Controller writes this CR to
#   <kubeletRoot>/seccomp/kguardian/prod/deployment-web.json
# (see node-files/kguardian/prod/deployment-web.json for the exact bytes).
# Because this profile denies, the Controller also adds
# "flags": ["SECCOMP_FILTER_FLAG_LOG"], so the kernel still audits every
# denial and DenialsObserved stays accurate after promotion.
#
# Pods reference the file by path (see web-workload.yaml):
#   securityContext.seccompProfile:
#     type: Localhost
#     localhostProfile: kguardian/prod/deployment-web.json
#
# The kubelet reads the file when a container starts. Promotion therefore
# takes effect on each pod's next restart, and so does a profile that is too
# tight. To revert, change defaultAction back to SCMP_ACT_LOG, apply, wait for
# READY n/n, and restart the pods. Running pods keep the filter they started
# with until then:
#   kubectl -n prod rollout restart deployment/web
apiVersion: kguardian.dev/v1alpha1
kind: SeccompProfile
metadata:
  name: deployment-web
  namespace: prod
  annotations:
    kguardian.dev/capture-complete: "true"
    kguardian.dev/capture-level: full
spec:
  defaultAction: SCMP_ACT_ERRNO
  architectures:
    - SCMP_ARCH_AARCH64
    - SCMP_ARCH_X86_64
  syscalls:
    - names:
        - accept4
        - access # x86_64 only (aarch64: faccessat)
        - arch_prctl # x86_64 only: TLS setup by glibc at startup
        - bind
        - brk
        # capget, capset, setgid, setgroups and setuid: the nginx master starts
        # as root and drops to the nginx user for its workers.
        - capget
        - capset
        - chdir
        - chown # x86_64 only (aarch64: fchownat)
        - clock_nanosleep
        - clone
        - clone3
        - close
        - connect
        - dup2 # x86_64 only (aarch64: dup3)
        - dup3
        - epoll_create # x86_64 only (aarch64: epoll_create1)
        - epoll_create1
        - epoll_ctl
        - epoll_pwait
        - epoll_wait # x86_64 only (aarch64: epoll_pwait)
        - eventfd2 # aio completion notifications (nginx built --with-file-aio)
        - execve # the entrypoint exec after the runtime installs the filter
        - exit
        - exit_group
        - faccessat
        - faccessat2
        - fadvise64 # md5sum in 10-listen-on-ipv6-by-default.sh
        - fchmod # sed -i in the entrypoint scripts
        - fchown
        - fchownat
        - fcntl
        - fstat
        - futex
        - getcwd
        - getdents64 # /docker-entrypoint.d/ scripts are walked at startup
        - getegid
        - geteuid
        - getgid
        - getpid
        - getppid
        - getrandom
        - getsockname
        - getsockopt
        - gettid
        - getuid
        - io_destroy
        - io_setup # nginx probes Linux native aio at startup
        - ioctl
        - kill # the master signals workers on reload and shutdown
        - listen
        - lseek
        - madvise
        - mkdir # x86_64 only (aarch64: mkdirat); nginx's temp directories
        - mkdirat
        - mmap
        - mprotect
        - munmap
        - newfstatat
        - openat
        - pipe # x86_64 only (aarch64: pipe2); the entrypoint shell
        - pipe2
        - prctl
        - pread64
        - prlimit64
        - read
        - recvfrom
        - recvmsg
        - rename # x86_64 only (aarch64: renameat2); sed -i
        - renameat2
        - rseq
        - rt_sigaction
        - rt_sigprocmask
        - rt_sigreturn
        - rt_sigsuspend # the nginx master waits for signals here
        - sched_getaffinity # worker_processes auto
        - sendfile
        - sendmsg
        - sendto
        - set_robust_list
        - set_tid_address
        - setgid
        - setgroups
        - setsockopt
        - setuid
        - shutdown
        - socket
        - socketpair # master/worker channel
        - umask
        - uname
        - unlink # x86_64 only (aarch64: unlinkat); pid file removal on shutdown
        - unlinkat
        - utimensat # touch in the entrypoint scripts
        - wait4
        - write
        - writev
      action: SCMP_ACT_ALLOW
  workloadRef:
    kind: Deployment
    name: web
