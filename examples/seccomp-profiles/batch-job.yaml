# Example SeccompProfile for a batch workload: a CronJob that runs a static Go
# binary once a night, pulls data over HTTPS and writes a report.
#
# This is a SAMPLE. Real profiles have to be generated by kguardian from your
# workload's observed syscalls, not copied from here. See README.md.
#
# It is stricter than the web profile in two ways:
#   - The list is short (39 names). A static Go binary needs no shell, no
#     setuid, no listening socket and no filesystem writes beyond stdout. Go
#     starts threads with clone, not clone3.
#   - defaultAction is SCMP_ACT_KILL_PROCESS, not SCMP_ACT_ERRNO. A Job that
#     makes an unexpected syscall is killed and the Job records a failure,
#     instead of carrying on after an EPERM it may not handle. The kernel audits
#     KILL verdicts unconditionally, so kguardian's denial signal still sees
#     them.
#
# WARNING: SCMP_ACT_KILL_PROCESS gives an incomplete profile no second chance.
# The first unlisted syscall kills the whole process with SIGSYS. There is no
# EPERM for the code to handle and no partial output. Never start here.
#
# Audit first, always. A CronJob's pods are attributed to the CronJob
# (Job -> CronJob), and kguardian keeps a union across runs.
#   1. Export with the default action (SCMP_ACT_LOG) and apply that CR:
#        curl -s localhost:9090/seccomp/profiles/batch/CronJob/nightly-report/export \
#          > seccomp/batch/cronjob-nightly-report.yaml
#   2. Let several scheduled runs complete under it. One run rarely takes
#      every code path (retries, empty input, the month-end branch).
#   3. Check that the CR reads DenialsObserved=False with
#      status.denials.observed: 0 (Unknown, or an absent status.denials,
#      means "no data", not "clean"):
#        kubectl -n batch get seccompprofile cronjob-nightly-report -o json \
#          | jq '{c: ((.status.conditions // [])[] | select(.type=="DenialsObserved")), d: .status.denials}'
#   4. Only then change defaultAction to SCMP_ACT_KILL_PROCESS in git. The
#      result is this file. The next scheduled run picks it up.
#
# If you export with an enforcing action directly, the export returns 409
# while the capture is partial. Treat that as a signal to raise the capture
# tier, not something to work around.
#
# Distributed to <kubeletRoot>/seccomp/kguardian/batch/cronjob-nightly-report.json
# (see node-files/). The CronJob in batch-workload.yaml references that path.
apiVersion: kguardian.dev/v1alpha1
kind: SeccompProfile
metadata:
  name: cronjob-nightly-report
  namespace: batch
  annotations:
    kguardian.dev/capture-complete: "true"
    kguardian.dev/capture-level: full
spec:
  defaultAction: SCMP_ACT_KILL_PROCESS
  architectures:
    - SCMP_ARCH_AARCH64
    - SCMP_ARCH_X86_64
  syscalls:
    - names:
        - arch_prctl # x86_64 only: the Go runtime sets up TLS with it
        - clone
        - close
        - connect
        - epoll_create1
        - epoll_ctl
        - epoll_pwait
        - eventfd2 # Go netpoller wakeups
        - execve # the entrypoint exec after the runtime installs the filter
        - exit_group
        - fcntl
        - fstat
        - futex
        - getdents64 # crypto/x509 lists /etc/ssl/certs; runc lists /proc/self/fd
        - getpeername
        - getpid
        - getrandom
        - getsockname
        - getsockopt
        - gettid
        - madvise
        - mmap
        - munmap
        - nanosleep
        - newfstatat # /etc/resolv.conf, CA bundle
        - openat
        - prlimit64 # Go raises RLIMIT_NOFILE at startup
        - read
        - readlinkat
        - rt_sigaction
        - rt_sigprocmask
        - rt_sigreturn
        - sched_getaffinity # GOMAXPROCS
        - sched_yield
        - setsockopt
        - sigaltstack
        - socket
        - tgkill # Go async preemption signals its own threads
        - write
      action: SCMP_ACT_ALLOW
  workloadRef:
    kind: CronJob
    name: nightly-report
