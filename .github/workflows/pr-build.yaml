    defaults:
      run:
        working-directory: supplychain
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # go-version-file keeps the toolchain in step with go.mod, so CI can
      # never fall behind the module's go directive (GOTOOLCHAIN=local).
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
