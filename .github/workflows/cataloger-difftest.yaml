---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Cataloger Differential Test

# The gate for the cataloger's resolver (design review): Syft through the
# kernel-confined resolver must produce exactly what Syft's own directory
# source produces over the same unpacked images: package sets (type, name,
# version, PURL), distro, owned files, evidence and relationships.
#
# It runs on every change that can move that result: the cataloger's or
# the matcher's go.mod/go.sum (so every Syft or Grype bump, Renovate's
# included), the resolver, the Syft configuration, the fixtures, and this
# workflow; weekly as well, because the fixture tags move.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'cataloger/go.mod'
      - 'cataloger/go.sum'
      - 'supplychain-matcher/go.mod'
      - 'supplychain-matcher/go.sum'
      - 'cataloger/internal/rootfs/**'
      - 'cataloger/internal/scan/config.go'
      - 'cataloger/internal/difftest/**'
      - 'cataloger/testdata/difftest/**'
      - '.github/workflows/cataloger-difftest.yaml'
  push:
    branches:
      - main
    paths:
      - 'cataloger/go.mod'
      - 'cataloger/go.sum'
      - 'supplychain-matcher/go.mod'
      - 'supplychain-matcher/go.sum'
      - 'cataloger/internal/rootfs/**'
      - 'cataloger/internal/scan/config.go'
      - 'cataloger/internal/difftest/**'
      - 'cataloger/testdata/difftest/**'
  schedule:
    # Mondays 05:00 UTC, before the weekly security scan.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cataloger-difftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  difftest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cataloger
    env:
      # All of them: a fixture that failed to pull or build must fail the
      # gate, not silently shrink it.
      KG_DIFFTEST_REQUIRE: alpine,debian,ubi-minimal,distroless,static-go,rust-auditable,spring-boot,python,node,symlinked-apk-db,symlinked-dpkg-db
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The comparison is only meaningful against the Syft Grype matches with.
      - name: Syft matches the matcher's
        run: hack/check-syft-version.sh

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: cataloger/go.mod
          cache-dependency-path: cataloger/go.sum

      - name: Build fixtures
        env:
          FIXTURES: ${{ runner.temp }}/kgc-fixtures
        run: testdata/difftest/fixtures.sh "$FIXTURES"

      - name: Differential test
        env:
          FIXTURES: ${{ runner.temp }}/kgc-fixtures
        run: |
          KG_DIFFTEST_FIXTURES="$FIXTURES" go test -tags difftest -count=1 -v -timeout 30m ./internal/difftest
