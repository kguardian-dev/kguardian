{{- if .Values.supplychain.enabled }}
{{- include "kguardian.supplychainAuthGuard" . }}
{{- /*
  One replica by design: the component turns report churn into
  per-digest payloads and de-duplicates them in memory. A second replica
  would not add capacity, only a second copy of every send.
*/ -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.supplychain.service.name }}
  namespace: {{ include "kguardian.namespace" . }}
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
spec:
  replicas: 1
  {{- if and .Values.supplychain.grype.enabled .Values.supplychain.grype.persistence.enabled }}
  # A ReadWriteOnce DB volume cannot be attached to two pods at once.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.supplychain.service.name }}
  template:
    metadata:
      {{- with .Values.supplychain.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kguardian.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ .Values.supplychain.service.name }}
    spec:
      # Never auto-mounted: a pod-level mount would reach every container,
      # including the Grype matcher. The supplychain container alone gets a
      # projected token, and only when it needs the API (Trivy Operator).
      automountServiceAccountToken: false
      {{- with .Values.supplychain.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ default "supplychain" .Values.supplychain.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.supplychain.podSecurityContext | nindent 8 }}
      containers:
        - name: supplychain
          securityContext:
            {{- toYaml .Values.supplychain.securityContext | nindent 12 }}
          {{- if .Values.supplychain.image.sha }}
          image: "{{ .Values.supplychain.image.repository }}@{{ .Values.supplychain.image.sha }}"
          {{- else }}
          image: "{{ .Values.supplychain.image.repository }}:{{ include "kguardian.imageTag" .Values.supplychain.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.supplychain.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.supplychain.container.port }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.supplychain.container.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.supplychain.logLevel | quote }}
            - name: TRIVY_OPERATOR_ENABLED
              value: {{ .Values.supplychain.sources.trivyOperator.enabled | quote }}
            - name: TRIVY_RESYNC_PERIOD
              value: {{ .Values.supplychain.sources.trivyOperator.resyncPeriod | quote }}
            - name: TRIVY_RECHECK_PERIOD
              value: {{ .Values.supplychain.sources.trivyOperator.recheckPeriod | quote }}
            - name: BROKER_URL
              value: "http://{{ .Values.broker.service.name }}.{{ include "kguardian.namespace" . }}.svc.cluster.local:{{ .Values.broker.service.port }}"
            - name: BROKER_INGEST_ENABLED
              value: {{ .Values.supplychain.brokerIngest.enabled | quote }}
            {{- /* Opt-in only: never follows brokerIngest.enabled. */}}
            - name: REGISTRY_LOOKUP_ENABLED
              value: {{ .Values.supplychain.registryLookup.enabled | default false | quote }}
            - name: REGISTRY_ALLOW_PRIVATE
              value: {{ .Values.supplychain.registryLookup.allowPrivateRegistries | quote }}
            {{- /* Opt-in only: never follows brokerIngest.enabled. */}}
            - name: REGISTRY_SBOM_ENABLED
              value: {{ .Values.supplychain.sources.registry.enabled | default false | quote }}
            - name: REGISTRY_SBOM_INTERVAL
              value: {{ .Values.supplychain.sources.registry.interval | quote }}
            {{- $sd := .Values.supplychain.signatureDiscovery | default dict }}
            {{- if $sd.enabled }}
            {{- if not .Values.supplychain.brokerIngest.enabled }}
            {{- fail "supplychain.signatureDiscovery.enabled=true needs supplychain.brokerIngest.enabled=true: the running digests come from the broker and results go back to it" }}
            {{- end }}
            - name: ATTESTATION_ENABLED
              value: "true"
            - name: ATTESTATION_INTERVAL
              value: {{ $sd.interval | default "10m" | quote }}
            - name: ATTESTATION_WORKERS
              value: {{ $sd.workers | default 2 | quote }}
            - name: ATTESTATION_REGISTRY_RPS
              value: {{ $sd.registryRps | default 5 | quote }}
            - name: ATTESTATION_SKIP_SCT
              value: {{ $sd.skipSCT | default false | quote }}
            {{- if $sd.publicKeys }}
            - name: ATTESTATION_KEYS_DIR
              value: /etc/kguardian/signing-keys
            {{- end }}
            {{- if $sd.trustedRoot }}
            - name: ATTESTATION_TRUSTED_ROOT_FILE
              value: /etc/kguardian/sigstore/trusted_root.json
            {{- end }}
            {{- end }}
            {{- /* Scoped token: this component can only reach the supplychain routes. */}}
            {{- include "kguardian.brokerAuthClientEnv" (dict "root" $ "scope" "supplychain") | nindent 12 }}
            {{- if .Values.supplychain.grype.enabled }}
            - name: GRYPE_MATCHER_URL
              value: "http://127.0.0.1:{{ .Values.supplychain.grype.port }}"
            {{- end }}
            {{- with .Values.supplychain.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.supplychain.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.supplychain.sources.trivyOperator.enabled }}
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- if and $sd.enabled $sd.publicKeys }}
            - name: signing-keys
              mountPath: /etc/kguardian/signing-keys
              readOnly: true
            {{- end }}
            {{- if and $sd.enabled $sd.trustedRoot }}
            - name: sigstore-root
              mountPath: /etc/kguardian/sigstore
              readOnly: true
            {{- end }}
        {{- if .Values.supplychain.grype.enabled }}
        {{- $g := .Values.supplychain.grype }}
        # Grype matcher (#1533, option B): separate image, loopback only, no
        # Kubernetes or broker token, owns the vulnerability DB volume.
        - name: grype-matcher
          securityContext:
            {{- toYaml .Values.supplychain.securityContext | nindent 12 }}
          {{- if $g.image.sha }}
          image: "{{ $g.image.repository }}@{{ $g.image.sha }}"
          {{- else }}
          image: "{{ $g.image.repository }}:{{ include "kguardian.imageTag" $g.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: LISTEN_ADDR
              value: "127.0.0.1:{{ $g.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.supplychain.logLevel | quote }}
            - name: GRYPE_DB_DIR
              value: /var/lib/grype
            - name: GRYPE_DB_URL
              value: {{ $g.db.url | quote }}
            - name: GRYPE_DB_AUTO_UPDATE
              value: {{ $g.db.autoUpdate | quote }}
            - name: GRYPE_DB_UPDATE_INTERVAL
              value: {{ $g.db.updateInterval | quote }}
            - name: GRYPE_DB_MAX_AGE
              value: {{ $g.db.maxAge | quote }}
            - name: MATCH_TIMEOUT
              value: {{ $g.matchTimeout | quote }}
            - name: GOMEMLIMIT
              value: {{ $g.goMemLimit | quote }}
          # The server listens on loopback only, which kubelet HTTP probes
          # cannot reach, so the binary probes itself. No readiness probe:
          # the first DB download takes minutes and must not hold the pod
          # (and the supplychain container's own sources) NotReady.
          livenessProbe:
            exec:
              command: ["/usr/local/bin/kguardian-supplychain-matcher", "probe", "healthz"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          {{- /* emptyDir mode: reserve node ephemeral storage for the DB
               (3.1 GB unpacked, about 6.4 GB during a refresh). */}}
          {{- $res := deepCopy ($g.resources | default dict) }}
          {{- if not $g.persistence.enabled }}
          {{- $_ := set $res "requests" (merge (dict "ephemeral-storage" "7Gi") (get $res "requests" | default dict)) }}
          {{- $_ := set $res "limits" (merge (dict "ephemeral-storage" "9Gi") (get $res "limits" | default dict)) }}
          {{- end }}
          {{- with $res }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: grype-db
              mountPath: /var/lib/grype
            - name: grype-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        # Read-only root filesystem; client-go and the Go runtime get a
        # small scratch dir.
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- if .Values.supplychain.sources.trivyOperator.enabled }}
        # The standard service-account projection, mounted into the
        # supplychain container only.
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
        {{- if .Values.supplychain.grype.enabled }}
        {{- $p := .Values.supplychain.grype.persistence }}
        - name: grype-db
          {{- if $p.enabled }}
          persistentVolumeClaim:
            claimName: {{ $p.existingClaim | default (printf "%s-grype-db" .Values.supplychain.service.name) }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ $p.size }}
          {{- end }}
        # Listing download scratch (a few KiB).
        - name: grype-tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- end }}
        {{- if and $sd.enabled $sd.publicKeys }}
        - name: signing-keys
          configMap:
            name: {{ .Values.supplychain.service.name }}-signing-keys
        {{- end }}
        {{- if and $sd.enabled $sd.trustedRoot }}
        - name: sigstore-root
          configMap:
            name: {{ .Values.supplychain.service.name }}-sigstore-root
        {{- end }}
      {{- with .Values.supplychain.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supplychain.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supplychain.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supplychain.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "kguardian.priorityClassName" (dict "component" .Values.supplychain "global" .Values.global) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
{{- end }}
