{{- /* Resolved and validated nodeCatalog values (_helpers.tpl). */}}
{{- $nc := include "kguardian.nodeCatalog" . | fromJson }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kguardian.name" . }}-controller
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
spec:
  {{- with .Values.controller.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kguardian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kguardian
        {{- include "kguardian.labels" . | nindent 8 }}
      {{- if $nc.enabled }}
      annotations:
        # Cloud workload-identity webhooks inject credentials into every
        # container of a pod whose service account has an identity. Keep
        # them out of the cataloger (IRSA / EKS pod identity webhook: comma
        # list; Azure Workload Identity: semicolon list). GKE Workload
        # Identity injects nothing; see docs/reference/node-catalog.
        eks.amazonaws.com/skip-containers: cataloger
        azure.workload.identity/skip-containers: cataloger
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.controller.serviceAccount.automountServiceAccountToken }}
      hostNetwork: true
      {{- if .Values.controller.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml .Values.controller.imagePullSecrets | indent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-api
          {{- if .Values.controller.initContainer.image.sha }}
          image: "{{ .Values.controller.initContainer.image.repository }}@{{ .Values.controller.initContainer.image.sha }}"
          {{- else }}
          image: "{{ .Values.controller.initContainer.image.repository }}:{{ .Values.controller.initContainer.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.controller.initContainer.image.pullPolicy }}
          command: ["sh", "-c", "until wget -qO- http://{{ .Values.broker.service.name }}.{{ include "kguardian.namespace" . }}.svc.cluster.local:{{ .Values.broker.container.port }}/health; do sleep 5; done"]
          securityContext:
            {{- toYaml .Values.controller.initContainer.securityContext | nindent 12 }}
      containers:
        - name: controller
          {{- if .Values.controller.image.sha }}
          image: "{{ .Values.controller.image.repository }}@{{ .Values.controller.image.sha }}"
          {{- else }}
          image: "{{ .Values.controller.image.repository }}:{{ include "kguardian.imageTag" .Values.controller.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
          env:
          - name: RUST_LOG
            value: INFO
          - name: CURRENT_NODE
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: API_ENDPOINT
            value: "http://{{ .Values.broker.service.name }}.{{ include "kguardian.namespace" . }}.svc.cluster.local:{{ .Values.broker.container.port }}"
          {{- include "kguardian.brokerAuthClientEnv" (dict "root" $ "scope" "ingest") | nindent 10 }}
          - name: EXCLUDED_NAMESPACES
            value: "{{ .Values.controller.excludedNamespaces | join "," }}"
          - name: IGNORE_DAEMONSET_TRAFFIC
            value: "{{ .Values.controller.ignoreDaemonSet }}"
          - name: CONTAINERD_SOCK
            value: "{{ .Values.controller.containerdSockPath }}"
          {{- $level := .Values.syscalls.captureLevel | default "full" | toString | lower }}
          {{- if not (has $level (list "full" "high" "medium" "low" "custom")) }}
          {{- fail (printf "syscalls.captureLevel must be one of full, high, medium, low, custom (got %q)" $level) }}
          {{- end }}
          {{- if and (eq $level "custom") (not .Values.syscalls.customList) }}
          {{- fail "syscalls.captureLevel is custom but syscalls.customList is empty" }}
          {{- end }}
          # Syscall capture tier. Only `full` yields a complete seccomp
          # profile; see values.yaml `syscalls`.
          - name: SYSCALL_CAPTURE_LEVEL
            value: {{ $level | quote }}
          {{- if eq $level "custom" }}
          - name: SYSCALL_CUSTOM_LIST
            value: {{ .Values.syscalls.customList | join "," | quote }}
          {{- end }}
          # Kernel seccomp verdict capture (the audit_seccomp kprobe). This
          # is a different signal from SYSCALL_CAPTURE_LEVEL above: that is
          # eBPF syscall *observation*, used to build a profile; this is
          # the kernel's own *verdict* on a filter already loaded from one.
          # See values.yaml `seccomp.denials`.
          - name: SECCOMP_DENIAL_CAPTURE
            value: {{ .Values.seccomp.denials.enabled | quote }}
          {{- if .Values.seccomp.denials.enabled }}
          {{- $denialInterval := .Values.seccomp.denials.intervalSeconds | int }}
          {{- if le $denialInterval 0 }}
          {{- fail (printf "seccomp.denials.intervalSeconds must be a positive integer (got %d)" $denialInterval) }}
          {{- end }}
          {{- if gt $denialInterval 600 }}
          {{- fail (printf "seccomp.denials.intervalSeconds must be 600 or less (got %d). The controller declares this cadence to the broker and the broker trusts a node for max(300, interval * 3) seconds after its last report, capped at 1800 - and that window is how long a workload keeps reporting DenialsObserved: False with nothing watching. A node draining slower than 600s is heard from less often than the broker will vouch for it, so its workloads sit at Unknown between reports. Lower seccomp.denials.intervalSeconds." $denialInterval) }}
          {{- end }}
          - name: SECCOMP_DENIAL_INTERVAL_SECONDS
            value: {{ $denialInterval | quote }}
          {{- end }}
          {{- if .Values.seccomp.distribute }}
          - name: SECCOMP_DISTRIBUTE
            value: "true"
          - name: SECCOMP_ROOT
            value: "{{ .Values.seccomp.kubeletRoot }}/seccomp"
          {{- with .Values.seccomp.distributeIntervalSeconds }}
          - name: SECCOMP_DISTRIBUTE_INTERVAL_SECS
            value: "{{ . }}"
          {{- end }}
          {{- end }}
          {{- $runtimeMode := (.Values.controller.runtimeInventory | default dict).mode | default "off" | toString | lower }}
          {{- if not (has $runtimeMode (list "off" "exec" "full")) }}
          {{- fail (printf "controller.runtimeInventory.mode must be one of off, exec, full (got %q)" $runtimeMode) }}
          {{- end }}
          {{- $runtimeCaps := (.Values.controller.runtimeInventory | default dict).capabilities | default false }}
          {{- /* The controller counts capabilities only when the inventory runs and
                 would silently drop the flag with mode off; refuse the combination.
                 "On" is what the controller reads as on: true, 1 or on. */}}
          {{- if and (has ($runtimeCaps | toString | trim | lower) (list "true" "1" "on")) (eq $runtimeMode "off") }}
          {{- fail "controller.runtimeInventory.capabilities requires controller.runtimeInventory.mode exec or full" }}
          {{- end }}
          # Per-container exec / library inventory (values.yaml
          # `controller.runtimeInventory`).
          - name: RUNTIME_INVENTORY
            value: {{ $runtimeMode | quote }}
          - name: RUNTIME_INVENTORY_CAPABILITIES
            value: {{ $runtimeCaps | quote }}
          {{- $compute := .Values.compute | default dict }}
          {{- if $compute.enabled }}
          # Compute gauges + noisy-neighbour detection (values.yaml `compute`).
          # The cgroup sampler is the master switch; the scheduler probe is a
          # second switch beneath it and is off by default until measured.
          - name: COMPUTE_ENABLED
            value: "true"
          - name: COMPUTE_SAMPLE_INTERVAL_SECS
            value: {{ $compute.sampleInterval | default 5 | quote }}
          - name: COMPUTE_CONTENTION_ENABLED
            value: {{ (($compute.contention | default dict).enabled | default false) | quote }}
          - name: COMPUTE_MIN_RUNQ_LATENCY_US
            value: {{ (($compute.contention | default dict).minRunqLatencyUs | default 100) | quote }}
          {{- else }}
          - name: COMPUTE_ENABLED
            value: "false"
          {{- end }}
          {{- if $nc.enabled }}
          # Node SBOM cataloging (values.yaml `nodeCatalog`): this container
          # opens each running container's root and hands it to the
          # cataloger sidecar over the socket on the shared emptyDir.
          - name: NODE_CATALOG
            value: "on"
          {{- include "kguardian.catalogTokenEnv" . | nindent 10 }}
          - name: NODE_CATALOG_SOCKET
            value: /run/kguardian/catalog/worker.sock
          - name: NODE_CATALOG_EPOCH
            value: {{ $nc.epoch | quote }}
          - name: NODE_CATALOG_SCAN_TIMEOUT_SECS
            value: {{ $nc.scanTimeoutSeconds | quote }}
          - name: NODE_CATALOG_MAX_FILES
            value: {{ $nc.maxFiles | quote }}
          - name: NODE_CATALOG_MAX_COMPONENTS
            value: {{ $nc.maxComponents | quote }}
          - name: NODE_CATALOG_MIN_SCAN_INTERVAL_SECS
            value: {{ $nc.minScanIntervalSeconds | quote }}
          - name: NODE_CATALOG_PRESSURE_THRESHOLD
            value: {{ $nc.pressureThreshold | quote }}
          - name: NODE_CATALOG_MAX_PRESSURE_DEFER_SECS
            value: {{ $nc.maxPressureDeferSeconds | quote }}
          - name: NODE_CATALOG_RO_CLONE
            value: {{ if $nc.readOnlyClone }}"on"{{ else }}"off"{{ end }}
          # The Controller never offers its own pod's images.
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          {{- end }}
          volumeMounts:
          {{- if .Values.seccomp.distribute }}
          - name: seccomp-profiles
            mountPath: {{ .Values.seccomp.kubeletRoot }}/seccomp
          {{- end }}
          {{- if or $compute.enabled .Values.seccomp.denials.enabled }}
          - name: cgroupfs
            mountPath: /sys/fs/cgroup
            readOnly: true
          {{- end }}
          - mountPath: /sys/kernel/debug
            name: debugfs
            readOnly: true
          - name: bpffs
            mountPath: /sys/fs/bpf
            readOnly: true
          - name: run-containerd-bundle
            mountPath: /run/containerd/io.containerd.runtime.v2.task
            readOnly: true
          - name: containerd-sock
            mountPath: {{ .Values.controller.containerdSockPath }}
            readOnly: true
          - mountPath: /sys/kernel/tracing
            name: tracefs
            readOnly: true
          - mountPath: /proc
            name: hostproc
            readOnly: true
          {{- if $nc.enabled }}
          - name: catalog-socket
            mountPath: /run/kguardian/catalog
          {{- end }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $nc.enabled }}
        {{- $w := $nc.worker }}
        # Node SBOM worker (cataloger/README.md). It parses untrusted image
        # content, so it holds no Broker or service-account token and no
        # host mounts. The uid-0 parent parses nothing: it keeps
        # DAC_READ_SEARCH, SETUID and SETGID only, and runs each scan in a
        # fresh child as uid 2000000000 with DAC_READ_SEARCH alone. The pod
        # is hostNetwork, so the parent shares the node's network namespace
        # (it opens only its Unix socket); the scan child is the part that
        # parses image content, and its seccomp filter denies every socket.
        - name: cataloger
          {{- if $w.image.sha }}
          image: "{{ $w.image.repository }}@{{ $w.image.sha }}"
          {{- else }}
          image: "{{ $w.image.repository }}:{{ include "kguardian.imageTag" $w.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ $w.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_READ_SEARCH
                - SETUID
                - SETGID
            seccompProfile:
              type: RuntimeDefault
            {{- with $w.seLinuxOptions }}
            seLinuxOptions:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $w.appArmorProfile }}
            appArmorProfile:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          env:
            - name: CATALOG_SOCKET
              value: /run/kguardian/catalog/worker.sock
            - name: CATALOG_TMP_DIR
              value: /tmp
            - name: CATALOG_MEMORY_LIMIT
              value: {{ $w.memoryLimitBytes | quote }}
            - name: CATALOG_TMP_LIMIT
              value: {{ $w.tmpLimitBytes | quote }}
            - name: LOG_LEVEL
              value: {{ $w.logLevel | quote }}
          # Liveness only: `ping` is answered even while a scan runs
          # (PROTOCOL.md 3.3). No readiness probe, so a stuck worker does
          # not hold the pod NotReady; a crash-looping one still does
          # (a container that is not running is never ready).
          livenessProbe:
            exec:
              command: ["/usr/local/bin/kguardian-cataloger", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          {{- with $w.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The worker makes this directory 0700 and the socket 0600, both
            # owned by uid 0, and the Controller refuses anything else.
            - name: catalog-socket
              mountPath: /run/kguardian/catalog
            - name: catalog-tmp
              mountPath: /tmp
            # Shadows the service-account token the pod mounts for the
            # Controller: the worker gets an empty directory instead.
            - name: catalog-no-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
        {{- end }}
      serviceAccountName: {{ default "controller" .Values.controller.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "kguardian.priorityClassName" (dict "component" .Values.controller "global" .Values.global) }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      volumes:
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
          type: Directory
      - name: run-containerd-bundle
        hostPath:
          path: {{ .Values.controller.containerdBundlePath }}
      - name: containerd-sock
        hostPath:
          path: {{ .Values.controller.containerdSockPath }}
      - hostPath:
          path: /proc
          type: Directory
        name: hostproc
      - hostPath:
          path: /sys/kernel/debug
        name: debugfs
      - hostPath:
          path: /sys/kernel/tracing
          type: Directory
        name: tracefs
      {{- if .Values.seccomp.distribute }}
      # Kubelet seccomp root. DirectoryOrCreate so the first node to
      # need it provisions the tree; the distributor only ever adds
      # files under kguardian/.
      - name: seccomp-profiles
        hostPath:
          path: {{ .Values.seccomp.kubeletRoot }}/seccomp
          type: DirectoryOrCreate
      {{- end }}
      {{- if or (.Values.compute | default dict).enabled .Values.seccomp.denials.enabled }}
      # cgroup v2 root, read-only. Two features need it and they are
      # switched independently:
      #
      #   * the compute sampler reads cpu.stat, cpu.pressure, memory.*
      #     per container and /sys/fs/cgroup/cgroup.controllers for the
      #     node facts;
      #   * seccomp denial capture resolves each container's cgroup id
      #     from this tree (name_to_handle_at), which is the only way to
      #     attribute a hostNetwork pod's kernel verdicts — such a pod
      #     shares the node's network namespace with every other one, so
      #     the netns inode names none of them.
      #
      # Without the mount the second degrades to counting and dropping
      # those verdicts, and a workload nothing can attribute reports no
      # denials, which reads as no denials. Keep this condition in step
      # with the registry's in controller/src/main.rs. Nothing is ever
      # written here.
      - name: cgroupfs
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      {{- end }}
      {{- if $nc.enabled }}
      # Shared by the Controller and the cataloger; holds only the socket.
      - name: catalog-socket
        emptyDir:
          sizeLimit: 1Mi
      # Scan temp space (archive extraction). Memory-backed, so its pages
      # count against the cataloger's memory limit; sizeLimit equals
      # CATALOG_TMP_LIMIT, which the worker's watchdog enforces too.
      - name: catalog-tmp
        emptyDir:
          medium: Memory
          sizeLimit: {{ $nc.worker.tmpLimitBytes | quote }}
      - name: catalog-no-token
        emptyDir:
          sizeLimit: 1Ki
      {{- end }}
      nodeSelector:
        {{- if .Values.controller.nodeSelector }}
          {{- toYaml .Values.controller.nodeSelector | nindent 8 }}
        {{- end }}
