apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kguardian.name" . }}-viewer
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
    {{- include "kguardian.annotations" . | nindent 2 }}
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "services"]
  verbs:
    - get
    - watch
    - list
# The controller reads its OWN Node object once at startup to derive
# coarse environment facts (provider/distro/CNI/IP family/OS) for the
# anonymous telemetry check-in (docs/telemetry.mdx). get only — no
# list/watch over nodes.
- apiGroups: [""]
  resources: ["nodes"]
  verbs:
    - get
- apiGroups: ["apps"]
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
