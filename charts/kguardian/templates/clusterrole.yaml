apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kguardian.name" . }}-viewer
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
    {{- include "kguardian.annotations" . | nindent 2 }}
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "services"]
  verbs:
    - get
    - watch
    - list
# The controller reads its OWN Node object once at startup to derive
# coarse environment facts (provider/distro/CNI/IP family/OS) for the
# anonymous telemetry check-in (docs/telemetry.mdx). get only — no
# list/watch over nodes.
- apiGroups: [""]
  resources: ["nodes"]
  verbs:
    - get
- apiGroups: ["apps"]
  resources:
  - deployments
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
{{- if .Values.seccomp.distribute }}
# Seccomp distribution: the controller watches SeccompProfile CRs
# cluster-wide, writes each to its node, and reports per-node state via
# server-side apply on the status subresource. `nodes` list is needed to
# compute ready/total for the summary condition. None of this is granted
# when seccomp.distribute is off.
- apiGroups: ["kguardian.dev"]
  resources: ["seccompprofiles"]
  verbs:
    - get
    - list
    - watch
- apiGroups: ["kguardian.dev"]
  resources: ["seccompprofiles/status"]
  verbs:
    - patch
- apiGroups: [""]
  resources: ["nodes"]
  verbs:
    - list
{{- end }}
