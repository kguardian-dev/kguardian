{{- if and .Values.broker.metrics.prometheusRule.enabled (include "kguardian.nodeCatalogEnabled" .) }}
# Alerts over the Broker's kguardian_node_catalog_* metrics (values.yaml
# `nodeCatalog`; broker/README.md lists them). Same preconditions as the
# seccomp rules in prometheusrule.yaml: something must scrape the Broker,
# and a Broker NetworkPolicy must let it. The counters live on whichever
# Broker replica served the request, so every rule sums across replicas;
# queue_depth and coverage_ratio are reported by the leader only.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kguardian.name" . }}-broker-node-catalog
  namespace: {{ include "kguardian.namespace" . }}
  labels:
    {{- include "kguardian.labels" . | nindent 4 }}
    {{- with .Values.broker.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kguardian.node-catalog
      rules:
        # The chart renders the catalog key as optional, so a Secret
        # without it starts fine and catalogs nothing.
        - alert: KguardianNodeCatalogTokenMissing
          expr: max(kguardian_node_catalog_token_missing) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The Broker has no node catalog token"
            description: >-
              nodeCatalog is enabled but the Broker has no BROKER_TOKEN_CATALOG:
              the auth Secret lacks the key named by broker.auth.keys.catalog.
              Catalog uploads answer 503 and no node SBOM is stored. Add the key
              and restart the Broker and the Controller DaemonSet.
            runbook_url: "https://docs.kguardian.dev/reference/node-catalog"

        # SELinux or AppArmor refused the worker the container root. On
        # SELinux nodes this means the worker's label is not the default
        # container_t:s0-s0:c0.c1023 (nodeCatalog.worker.seLinuxOptions).
        - alert: KguardianNodeCatalogLsmDenied
          expr: sum(increase(kguardian_node_catalog_skipped_total{reason="lsm_denied"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "An LSM denies the cataloger access to container roots"
            description: >-
              {{`{{ $value | humanize }}`}} node x digest skip(s) with lsm_denied in the
              last hour (each is one node skipped for one digest for 24 h). Check nodeCatalog.worker.seLinuxOptions and
              appArmorProfile; `GET /catalog/status?node=<name>` names the nodes.
            runbook_url: "https://docs.kguardian.dev/reference/node-catalog"

        # Only the reasons that mean the scan itself failed. pid_gone,
        # drift and exited_before_catalog are normal churn (the container
        # went away or changed), released to another node at once.
        - alert: KguardianNodeCatalogFailureRate
          expr: |
            sum by (reason) (increase(kguardian_node_catalog_failed_total{reason=~"timeout|oom|error"}[1h]))
              / on () group_left
            sum(increase(kguardian_node_catalog_granted_total[1h])) > 0.2
            and on ()
            sum(increase(kguardian_node_catalog_granted_total[1h])) >= 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node catalog scans failing with {{`{{ $labels.reason }}`}}"
            description: >-
              {{`{{ $value | humanizePercentage }}`}} of node catalog grants in the last
              hour failed with {{`{{ $labels.reason }}`}}. oom: raise
              nodeCatalog.worker.memoryLimit (and the memory limit with it);
              timeout: raise nodeCatalog.scanTimeoutSeconds.
            runbook_url: "https://docs.kguardian.dev/reference/node-catalog"

        # Grants that a node actually worked on, but none completed in 6
        # hours. A grant ends in cataloged_total (full, partial, os_only,
        # no_packages_found, superseded), failed_total, or skipped_total:
        # a node that cannot catalog (sandboxed, lazy_snapshotter,
        # unsupported_rootfs, kernel_unsupported, lsm_denied, ...) is
        # granted first and then reports the skip. So skips are subtracted:
        # a cluster whose node pools cannot catalog grants and skips all
        # day with nothing broken. What remains are grants that ended in
        # a scan (or are still running), and none of them completing is a
        # stall. retry_cap skips follow a failed grant rather than end one,
        # so they make the subtraction conservative (it can only
        # under-count). Silenced while the kill switch is off on every
        # replica (grants_enabled 0). Counters are per replica, so summed.
        - alert: KguardianNodeCatalogStalled
          expr: |
            (
              sum(increase(kguardian_node_catalog_granted_total[6h]))
                -
              (sum(increase(kguardian_node_catalog_skipped_total[6h])) or on () vector(0))
            ) > 0
            and on ()
            (sum(increase(kguardian_node_catalog_cataloged_total[6h])) or on () vector(0)) == 0
            unless on ()
            max(kguardian_node_catalog_grants_enabled) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Node catalog granted work but completed none in 6 hours"
            description: >-
              {{`{{ $value | humanize }}`}} node catalog grants in the last 6 hours that no
              node skipped, and no completed SBOM. Check kguardian_node_catalog_failed_total and
              skipped_total by reason, the cataloger container's logs, and
              `GET /catalog/status?node=<name>`.
            runbook_url: "https://docs.kguardian.dev/reference/node-catalog"

        # Work is queued and no grant was made for over a day. Skipped
        # nodes are retried after 24 h, so even a queue that only nodes
        # which cannot catalog keep skipping produces a grant within 25 h;
        # none at all means no Controller is claiming: the Broker refuses
        # its epoch (422, NODE_CATALOG_MAX_EPOCH), its token is missing,
        # or cataloging is off on the Controllers. queue_depth is reported
        # by the leader only. Silenced while the kill switch is off.
        - alert: KguardianNodeCatalogNotClaiming
          expr: |
            (sum(increase(kguardian_node_catalog_granted_total[25h])) or on () vector(0)) == 0
            and on ()
            max(kguardian_node_catalog_queue_depth) > 0
            unless on ()
            max(kguardian_node_catalog_grants_enabled) == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Node catalog work is queued but no node has claimed any in 25 hours"
            description: >-
              No node catalog grant in 25 hours while digests are queued. Check the
              Controllers' logs for a refused epoch (nodeCatalog.epoch above
              nodeCatalog.maxEpoch) or a missing BROKER_TOKEN_CATALOG, and
              `GET /catalog/status?node=<name>`.
            runbook_url: "https://docs.kguardian.dev/reference/node-catalog"

        # Nodes too busy to scan for hours: scans wait while host PSI is
        # above nodeCatalog.pressureThreshold.
        - alert: KguardianNodeCatalogDeferredPressure
          expr: sum(increase(kguardian_node_catalog_skipped_total{reason="deferred_pressure"}[30m])) > 0
          for: 2h
          labels:
            severity: info
          annotations:
            summary: "Node catalog scans keep waiting for node pressure to drop"
            description: >-
              Nodes have skipped claims for deferred_pressure for 2 hours. Raise
              nodeCatalog.pressureThreshold or nodeCatalog.maxPressureDeferSeconds
              if these nodes are always this busy.
            runbook_url: "https://docs.kguardian.dev/reference/node-catalog"
{{- end }}
